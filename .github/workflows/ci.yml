name: CI
on:
  push:
    branches: [main, PySide6, "C*"]  # C* 匹配 C++：Actions 分支过滤器是 glob，'+' 不是合法模式字符
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ffmpeg（测试依赖外部进程）
        run: choco install ffmpeg -y --no-progress
      - name: Install
        run: |
          python -m pip install -U pip
          pip install -e ".[gui,dev]"
      - name: Test
        run: python -m pytest -q

  cpp-bitexact:
    # Phase1 逐位回归：同 runner 上 Python 预言机现生成语料 → C++ CLI 全量比对
    # （manifest 不跨 ffmpeg 版本复用，版本漂移由"现生成"消化）
    runs-on: windows-latest
    env:
      PYTHONIOENCODING: utf-8  # runner 控制台 cp1252，脚本中文输出会 UnicodeEncodeError
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ffmpeg（测试依赖外部进程）
        run: choco install ffmpeg -y --no-progress
      - name: Setup MinGW（runner 自带 MSYS2）
        run: |
          echo "C:\msys64\mingw64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          gcc --version
      - name: Install（预言机 core，仅 numpy）
        run: pip install -e .
      - name: Build
        run: |
          cmake -S src/cpp -B src/cpp/build -G "MinGW Makefiles"
          cmake --build src/cpp/build
      - name: 语料再生
        run: python scripts/gen_golden.py
      - name: 帧级逐位（内核回归）
        run: |
          python scripts/gen_frame_golden.py
          src\cpp\build\enc_test.exe golden\frames
      - name: 文件级逐位（57 条全量）
        run: python scripts/compare_cpp_golden.py
