name: Release
# 仅由 v* tag 触发；产物直接发 GitHub Release，不上传 workflow artifacts。
on:
  push:
    tags: ["v*"]

jobs:
  build-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install -U pip
          pip install -e ".[gui]"
          pip install nuitka ordered-set
      - name: Build（Nuitka onefile，PySide6 插件捆 Qt DLL）
        run: >
          python -m nuitka --standalone --onefile
          --windows-console-mode=disable
          --assume-yes-for-downloads
          --enable-plugin=pyside6
          --include-package=amvconv
          --include-package-data=qfluentwidgets
          --output-filename=amvconv-gui-${{ github.ref_name }}.exe
          -m amvconv.gui.main_window
      - name: Smoke（exe 可启动，offscreen 冒烟后自退）
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          $p = Start-Process dist\amvconv-gui-${{ github.ref_name }}.exe -PassThru
          Start-Sleep -Seconds 20
          if (-not $p.HasExited -or $p.ExitCode -eq 0) { Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue; "SMOKE-OK" }
          else { "exe 提前退出 code=$($p.ExitCode)"; exit 1 }
      - name: Release（notes 取附注 tag 正文）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          git tag -l --format='%(contents)' ${{ github.ref_name }} | Out-File -Encoding utf8 notes.md;
          if ((Get-Content notes.md -Raw).Trim()) {
            gh release create ${{ github.ref_name }} dist/amvconv-gui-${{ github.ref_name }}.exe --title "AMV Converter ${{ github.ref_name }}" --notes-file notes.md
          } else {
            gh release create ${{ github.ref_name }} dist/amvconv-gui-${{ github.ref_name }}.exe --title "AMV Converter ${{ github.ref_name }}" --generate-notes
          }
